server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反代到后端容器；不带尾斜杠以保留 /api 前缀
    # ⚠️ 用 ^~ 而不是普通前缀：否则下面那条「静态扩展名」正则 location 会抢先生效，
    #    把 /api/media/xxx.jpg 这类图片请求当成本地文件去磁盘上找 → 404。
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量上传是一批图一起同步处理（存图 + 两张缩略图），1 vCPU 上 24 MB
        # 那批可能要几十秒；120s 曾经把大批量传到一半掐断。
        proxy_read_timeout 300s;
        # 单张上限 20 MB。这里必须按**整个请求**给足余量：前端按 24 MB 分批
        # （frontend/src/lib/upload.ts），64 MB 留一倍安全边际。两者要一起改。
        client_max_body_size 64m;
        # 超限时 nginx 默认回自己的 HTML 错误页，前端解析不出 detail，只能显示
        # 「请求失败（413）」。统一成后端同款 JSON，用户看到的是人话。
        error_page 413 = @payload_too_large;
    }

    # error_page 的落点：响应码保持 413（`=` 表示不改），只换 body。
    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"本次上传的内容超过网关上限（64 MB）。前端会自动分批，看到这条说明用了别的客户端或旧缓存，请刷新页面后重试"}';
    }

    # 带指纹的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源丢了就老实 404，**不要**回退成 index.html。
    # 否则 /favicon.svg 这种文件缺失时会返回 200 + text/html，浏览器只是悄悄不显示图标，
    # 网络面板里看着还「正常」—— v1.0.0 镜像少了 public/ 就是这么藏了一整版。
    location ~* \.(?:svg|ico|png|jpe?g|gif|webp|avif|bmp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
